<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #0c1015;
      --border: #323b46;
      --accent: #93b3ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f4f5;
        --border: #c3c9c1;
        --accent: #1747c9;
      }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="var(--border)" stroke-width="2"/>
  <text x="32" y="43" text-anchor="middle" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="var(--accent)" letter-spacing="-0.03em">SA</text>
</svg>
